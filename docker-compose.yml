services:
  postgres:
    image: postgres:16
    container_name: rc_comercial_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rc_comercial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CAMBIAR
    ports:
      - "5432:5432"
    volumes:
      - rc_comercial_data:/var/lib/postgresql/data

volumes:
  rc_comercial_data:
