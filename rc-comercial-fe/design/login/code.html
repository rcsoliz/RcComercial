<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .ticket-jagged-edge {
            position: relative;
            background: var(--tw-bg-opacity);
        }

        .ticket-jagged-edge::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 8px;
            background-image: linear-gradient(135deg, transparent 33.33%, #F6F5F0 33.33%, #F6F5F0 66.66%, transparent 66.66%), 
                              linear-gradient(45deg, transparent 33.33%, #F6F5F0 33.33%, #F6F5F0 66.66%, transparent 66.66%);
            background-size: 12px 24px;
            z-index: 10;
        }

        .inner-glow {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.03);
        }
        
        body {
            background-color: #EDECE6; /* papel */
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-tinta selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-[440px] relative">
<!-- Decoration / Atmospheric Element -->
<div class="absolute -top-16 -left-16 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-16 -right-16 w-64 h-64 bg-secondary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Main Card -->
<div class="ticket-jagged-edge bg-superficie rounded-t-lg shadow-sm overflow-visible border-x border-t border-linea relative z-10 transition-all duration-300">
<!-- Header Section -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="mb-6 flex justify-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-md rotate-3 hover:rotate-0 transition-transform duration-500 cursor-default">
<span class="font-headline-lg text-white text-[32px]">S</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">SysCenterS</h1>
<p class="font-body-sm text-tinta-3 mt-1 uppercase tracking-widest text-[10px]">Portal de Gestión Farmacéutica</p>
</div>
<!-- Form Section -->
<form action="#" class="px-8 pb-12 space-y-5" method="POST" onsubmit="return false">
<div class="space-y-1.5">
<label class="font-label-caps text-label-caps text-tinta-2 ml-1" for="username">Usuario</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tinta-3 text-[20px]">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-superficie-2 border border-transparent rounded-lg font-body-md text-tinta placeholder:text-tinta-3 focus:bg-superficie focus:border-primary focus:ring-0 transition-all duration-200 inner-glow" id="username" name="username" placeholder="ej. farmaceutico_01" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-tinta-2" for="password">Contraseña</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tinta-3 text-[20px]">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-superficie-2 border border-error/40 rounded-lg font-body-md text-tinta placeholder:text-tinta-3 focus:bg-superficie focus:border-error focus:ring-0 transition-all duration-200 inner-glow" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-tinta-3 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Error State Message -->
<div class="flex items-start gap-2 mt-2 bg-error-container/30 p-3 rounded-lg border border-error/10">
<span class="material-symbols-outlined text-error text-[18px] shrink-0">error</span>
<p class="font-body-sm text-error text-[13px] leading-snug">
                            La contraseña no es correcta. Te quedan 3 intentos.
                        </p>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary text-white py-3.5 rounded-lg font-headline-sm text-headline-sm shadow-md hover:bg-primary/90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 group" type="submit">
                        Acceder al Sistema
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<div class="flex flex-col items-center gap-4 pt-4">
<a class="font-body-sm text-primary hover:text-secondary underline underline-offset-4 decoration-primary/20 transition-colors" href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
<div class="flex items-center gap-2 w-full">
<div class="h-px bg-linea grow"></div>
<span class="font-data-mono text-[10px] text-tinta-3 uppercase">Ver: 2.4.0</span>
<div class="h-px bg-linea grow"></div>
</div>
</div>
</form>
</div>
<!-- Footer Visual Reference -->
<div class="mt-12 text-center">
<p class="font-body-sm text-tinta-3 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]">security</span>
                Conexión segura cifrada de punto a punto
            </p>
<div class="mt-8 flex justify-center gap-6 opacity-40 grayscale hover:opacity-100 hover:grayscale-0 transition-all duration-500">
<img class="h-6" data-alt="A minimalist professional logo of a healthcare certification body, vector style, monochromatic dark gray on a warm light background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJzAQU2m1qmCUwzb7jWV0uSblU5oJ4SmDpyr2gEiqe2X81Ywsp3-u42zfKhFn7lsLjsu5TVWRk-EQAP22ynepKke0_JWewMy6F9TCVGw947i3CwhXOGufMAxRCPzMuw6JnWblBY7nxdiNJjtOLrMyXauxAD0MHzuAm3a39yvL_tnznCZpSSGhJd5lQa7GT89Gf_4Hr2AIAOqotqt7DjR-D_Af8BaqYumH7x091n3OIT7GuBFBr2afLRvFSPyLxpVJaAoEuGiHtBoU"/>
<img class="h-6" data-alt="A clean, modern technical stamp showing ISO 27001 certification, high-quality vector graphic, utilitarian and corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9_nSh4jc-1xr-7jIUhFQNQmiGglUsQDUBNGLihrW7UJSGXljzTKBg1or9W8NjwKezNXEITgavcRHRmpqUu9odBSKcR5ucxpcLZ-GF9G3P0XpSiiOKKhPo7b1CxcFfac_iLRdqTgTMUGBoXdu7A7vYT1bd2v5n89o2HE3u899AHv4yEumy09Eyd3haRtIFeJhp7yAvEpRFW6tD5gb1MOBHfjOxbEWRFMPkvv7O7FWDY2LVggtZd4n3OtjbeTRaVwDrUIE02tWzGuk"/>
</div>
</div>
</main>
<!-- Background Decoration Script for subtle movement -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.ticket-jagged-edge');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Subtle parallax or glow effect can be added here if desired
            // For now, staying true to "Low Visual Consumption"
        });

        // Basic toggle for password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPass ? 'text' : 'password');
            toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
        });
    </script>
</body></html>
